name: Desktop distribution builds

on:
  workflow_dispatch:
  push:
    branches: [main, codex/distribution-channels]
    paths:
      - .github/workflows/desktop-distribution.yml
      - tools/distribution/build-desktop.mjs

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: macos-15-intel
            artifact: mac-x64
          - os: macos-15
            artifact: mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify native torrent module
        run: node --input-type=module -e "await import('webtorrent'); console.log('WebTorrent native modules loaded')"
      - name: Build native desktop packages
        run: npm run dist:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.dmg
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Add packages to the existing version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/distribution/upload-release.mjs dist/release
